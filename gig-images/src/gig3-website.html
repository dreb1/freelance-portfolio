<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { grid-template-columns: 1fr 560px; grid-template-rows: 1fr; gap: 40px; align-items: center; }
  .head { gap: 22px; }
  h1 { font-size: 70px; }
  .list { display: grid; gap: 12px; font-size: 23px; font-weight: 600; }
  .list span::before { content: "✓  "; color: var(--good); font-weight: 900; }
  .phones { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; height: 657px; }
  .phone { display: flex; flex-direction: column; gap: 12px; align-items: center; min-height: 0; }
  .frame { width: 260px; height: 600px; border: 8px solid #2c3a52; border-radius: 30px; overflow: hidden; background: #fff; position: relative; }
  /* Render the real pages at a true 390px phone width, scaled to fit the frame */
  .frame iframe { width: 390px; height: 880px; border: 0; transform: scale(0.626); transform-origin: 0 0; pointer-events: none; }
  .phone.bad .frame { border-color: var(--bad); }
  .phone.good .frame { border-color: var(--good); }
</style></head>
<body>
  <div class="head">
    <h1>Website <em>broken?</em><br>I'll fix it fast.</h1>
    <div class="list">
      <span>Broken on phones</span>
      <span>Menus &amp; buttons not working</span>
      <span>Forms not sending</span>
      <span>Slow or messy layout</span>
    </div>
    <div class="sub">HTML · CSS · JavaScript · WordPress</div>
  </div>
  <div class="phones">
    <div class="phone bad"><span class="tag bad">BEFORE</span><div class="frame"><iframe src="../../website-fixes/before/index.html" scrolling="no"></iframe></div></div>
    <div class="phone good"><span class="tag good">AFTER</span><div class="frame"><iframe src="../../website-fixes/after/index.html" scrolling="no"></iframe></div></div>
  </div>
</body></html>
